<!DOCTYPE html>
<html>
    <head>
        <title></title>
    </head>
    <body>
        <script>
            let menu = {
            width: 200,
            height: 300,
            title: "My menu"
            };

            multiplyNumeric(menu);

            for(let key in menu){
                alert(menu[key]);
            }



            function multiplyNumeric(obj){

                for(let key in obj){

                    if(+obj[key] === obj[key]){
                        obj[key] *= 2;
                    }

                }

            }

        </script>
    </body>
</html>
