<!DOCTYPE HTML>
<html>
    <head>
        <title>My first hello world in JS</title>
    </head>
    <body>
        <script>

            function ucFirst(name){

                return name[0].toUpperCase() + name.slice(1);

            }

            alert(ucFirst("john") == "John");
        </script>
    </body>
</html>
