<!DOCTYPE HTML>
<html>
    <head>
        <title></title>
    </head>
    <body>
        <script>
            function truncate(message , limit){

                if(message.length <= limit){
                    return message;
                }
                return message.slice(0 , 19) + "...";

            }
            alert(truncate("What I'd like to tell on this topic is:", 20));
        </script>
    </body>
</html>
