<!DOCTYPE HTML>
<html>
    <head>
        <title>My first hello world in JS</title>
    </head>
    <body>
        <p>Before the script</p>
        <script>
            let inputNum = prompt("Enter the num" , "");
            if(inputNum > 0){
                alert(1);
            }else if(inputNum < 0){
                alert(-1);
            }else{
                alert(0);
            }
        </script>
        <p>After the script</p>
    </body>
</html>
